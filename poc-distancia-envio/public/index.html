<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POC · Distancia de envío</title><style>:root{font-family:system-ui;color:#20241f;background:#f6f3eb}body{max-width:1050px;margin:40px auto;padding:0 20px}h1{margin-bottom:6px}p{color:#687067}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:24px}textarea{box-sizing:border-box;width:100%;min-height:130px;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:8px;background:#244d3b;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;margin-top:24px;background:#fff}th,td{padding:12px;border:1px solid #ddd;text-align:left;vertical-align:top}th{background:#edf0e8;font-size:12px}input{width:100px;padding:7px}.ok{color:#176c39}.warn{color:#9a6200}.error{color:#a32e2e}.detail{font-size:12px;color:#687067}</style></head><body><p>PRUEBA AISLADA · NO AFECTA PJ DELIVERY</p><h1>Distancia real de envío</h1><p>Ingresá una dirección de Resistencia por línea. Máximo 20 por prueba.</p><div class="card"><textarea id="addresses" placeholder="Av. Sarmiento 1200&#10;French 450"></textarea><button id="calculate">Calcular distancias</button><div id="message"></div></div><div id="results"></div><script>
const escapeHtml=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
document.querySelector('#calculate').onclick=async()=>{const button=document.querySelector('#calculate'),message=document.querySelector('#message'),addresses=document.querySelector('#addresses').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!addresses.length)return message.innerHTML='<p class="error">Ingresá al menos una dirección.</p>';button.disabled=true;message.innerHTML='<p>Consultando Google Maps Platform…</p>';try{const response=await fetch('/api/calculate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addresses})});const data=await response.json();if(!response.ok)throw new Error(data.error);document.querySelector('#results').innerHTML='<table><thead><tr><th>Entrada</th><th>Dirección encontrada</th><th>Confianza</th><th>Metros</th><th>Cuadras</th><th>Estimación manual</th></tr></thead><tbody>'+data.results.map((r,i)=>{const confidence=r.status==='ok'?'<span class="ok">Exacta</span>':r.status.startsWith('low_confidence')?'<span class="warn">Dudosa</span><div class="detail">'+escapeHtml(r.geocode.reasons.join('; '))+'</div>':'<span class="error">'+escapeHtml(r.error.message)+'</span>';return `<tr><td>${escapeHtml(addresses[i])}</td><td>${escapeHtml(r.geocode?.formattedAddress||'-')}</td><td>${confidence}</td><td>${r.route?.distanceMeters??'-'}</td><td>${r.route?.blocks??'-'}</td><td><input type="number" step="0.1" placeholder="cuadras"></td></tr>`}).join('')+'</tbody></table>';message.innerHTML='<p class="ok">Prueba terminada.</p>'}catch(e){message.innerHTML='<p class="error">'+escapeHtml(e.message)+'</p>'}finally{button.disabled=false}};
</script></body></html>
