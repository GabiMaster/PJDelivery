<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJ Delivery</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div><span class="eyebrow">GESTIÓN DEL LOCAL</span><h1 id="store-name">PJ Delivery</h1></div><div class="date" id="header-date"></div></header>
  <nav><button class="active" data-view="new">Nuevo pedido</button><button data-view="orders">Pedidos</button><button data-view="closure">Cierre de caja</button><button data-view="people">Personal</button></nav>
  <main>
    <section id="view-new" class="view active">
      <div class="title"><div><p class="eyebrow">CARGA RÁPIDA</p><h2>Nuevo pedido</h2></div><span class="badge">● Caja abierta</span></div>
      <form id="order-form" class="card form-grid">
        <label class="wide">Detalle del pedido<textarea name="description" required placeholder="Ej: 2 muzzarellas, 1 gaseosa..."></textarea></label>
        <label>Monto del pedido<input name="orderAmount" type="number" min="0" step="1" required placeholder="$ 0"></label>
        <label>Fecha<input name="businessDate" type="date" required></label>
        <fieldset><legend>Forma de pago</legend><div class="choice"><label><input type="radio" name="paymentMethod" value="cash" checked> Efectivo</label><label><input type="radio" name="paymentMethod" value="transfer"> Transferencia</label></div></fieldset>
        <fieldset><legend>Entrega</legend><div class="choice"><label><input type="radio" name="deliveryMethod" value="pickup" checked> Retiro</label><label><input type="radio" name="deliveryMethod" value="delivery"> Envío</label></div></fieldset>
        <label>Cajero<select name="cashierId" required></select></label>
        <div></div>
        <div id="delivery-fields" class="subgrid wide hidden">
          <label>Dirección<input name="address" placeholder="Calle, número y barrio"></label>
          <label>Teléfono<input name="phone" type="tel" placeholder="351..."></label>
          <label>Distancia<div class="inline"><input name="distance" type="number" min="0" step="0.1" value="0"><select name="distanceUnit"><option value="km">km</option><option value="blocks">cuadras</option></select></div></label>
          <label>Delivery asignado<select name="courierId"><option value="">Sin asignar</option></select></label>
        </div>
        <div class="total wide"><div><small>Pedido</small><strong id="base-preview">$ 0</strong></div><span>+</span><div><small>Envío</small><strong id="shipping-preview">$ 0</strong></div><span>=</span><div class="grand"><small>Total a cobrar</small><strong id="total-preview">$ 0</strong></div></div>
        <button class="primary wide" type="submit">Guardar pedido</button>
      </form>
    </section>
    <section id="view-orders" class="view"><div class="title"><div><p class="eyebrow">HISTORIAL</p><h2>Registro de pedidos</h2></div></div><div class="card filters"><label>Fecha<input id="filter-date" type="date"></label><label>Cajero<select id="filter-cashier"><option value="">Todos</option></select></label><label>Delivery<select id="filter-courier"><option value="">Todos</option></select></label><button id="filter-clear">Limpiar</button></div><div id="orders-table" class="card table-wrap"></div></section>
    <section id="view-closure" class="view"><div class="title"><div><p class="eyebrow">RESUMEN DIARIO</p><h2>Cierre de caja</h2></div><label>Jornada<input id="closure-date" type="date"></label></div><div id="closure-preview" class="summary"></div><button id="close-register" class="primary">Generar cierre y guardar snapshot</button><h3>Cierres anteriores</h3><div id="closures-table" class="card table-wrap"></div></section>
    <section id="view-people" class="view"><div class="title"><div><p class="eyebrow">CONFIGURACIÓN</p><h2>Personal</h2></div></div><div class="people-grid"><form id="cashier-form" class="card"><h3>Agregar cajero</h3><div class="inline"><input name="name" required placeholder="Nombre"><button>Agregar</button></div><ul id="cashier-list"></ul></form><form id="courier-form" class="card"><h3>Agregar delivery</h3><div class="inline"><input name="name" required placeholder="Nombre"><button>Agregar</button></div><ul id="courier-list"></ul></form></div></section>
  </main>
  <div id="toast"></div><script type="module" src="app.js"></script>
</body></html>
